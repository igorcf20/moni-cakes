# Loja 3D: site (SPA) e gateway da API no MESMO domínio.
#   /rest/v1/      -> rest:3000      (PostgREST)
#   /auth/v1/      -> auth:9999      (GoTrue)
#   /storage/v1/   -> storage:5000   (storage-api)
#   /functions/v1/ -> functions:9000 (edge-runtime)
#   o resto        -> site (index.html)
# Só estas quatro rotas chegam aos serviços; nada mais é exposto. Mesma origem: não é preciso CORS aqui.
# Este ficheiro entra em /etc/nginx/conf.d (contexto http).

# DNS interno do Docker: os serviços são resolvidos em tempo de execução (o nginx arranca mesmo que um
# serviço ainda não exista e acompanha a troca de IP quando um contentor é recriado).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream loja3d_rest      { zone loja3d_rest 64k;      server rest:3000 resolve; }
upstream loja3d_auth      { zone loja3d_auth 64k;      server auth:9999 resolve; }
upstream loja3d_storage   { zone loja3d_storage 64k;   server storage:5000 resolve; }
upstream loja3d_functions { zone loja3d_functions 64k; server functions:9000 resolve; }

# Esquema e domínio originais (vêm do nginx do servidor, que termina o HTTPS).
map $http_x_forwarded_proto $loja3d_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $loja3d_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}
# Pedidos só com o cabeçalho apikey (sem Authorization) seguem com "Bearer <apikey>", como no gateway da Supabase.
map $http_apikey $loja3d_apikey_bearer {
    default "Bearer $http_apikey";
    ""      "";
}
map $http_authorization $loja3d_authorization {
    default $http_authorization;
    ""      $loja3d_apikey_bearer;
}
# Prefixo público do storage (URLs de upload retomável).
map $uri $loja3d_prefix {
    ~^/storage/v1/ /storage/v1;
    default        "";
}

# Respostas da API e dos ficheiros enviados: CSP "sandbox". O site, a sessão (localStorage) e os ficheiros
# estão no MESMO domínio; sem isto, um cliente registado podia enviar para um bucket público um ficheiro
# com Content-Type "TEXT/HTML" ou "image/svg+xml" (o storage-api só troca "text/html" exato por text/plain)
# e o script corria com a sessão de quem abrisse o link (ex.: o admin). Em sandbox o documento não corre
# scripts nem lê o localStorage do site. Imagens em <img> e pedidos fetch() não são afetados.
# Exceção: PDF (application/pdf exato), porque o leitor de PDF do navegador não abre em sandbox; um PDF
# não corre scripts na origem do site.
map $uri $loja3d_api_path {
    ~^/(rest|auth|storage|functions)/v1/ 1;
    /sitemap.xml                         1;
    default                              0;
}
map "$loja3d_api_path:$upstream_http_content_type" $loja3d_api_csp {
    "~*^1:application/pdf$" "frame-ancestors 'self'";
    "~^1:"                  "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'self'";
    default                 "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # IP real do cliente: só a partir do nginx do servidor (127.0.0.1 publicado) e da rede interna do Docker.
    # O nginx do servidor deve enviar "X-Forwarded-For $proxy_add_x_forwarded_for" (e Host, X-Forwarded-Proto).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 2m;

    # add_header só é herdado por locations sem add_header próprio: repetido em /index.html.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # O site (incluindo o /admin) só pode ser mostrado em frames do próprio domínio (clickjacking).
    add_header X-Frame-Options SAMEORIGIN always;
    # Só nas rotas da API (vazio no resto: o nginx não envia o cabeçalho). Ver o map $loja3d_api_csp.
    add_header Content-Security-Policy $loja3d_api_csp always;
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/openapi+json image/svg+xml;

    # Cabeçalhos para todos os serviços (as locations da API não definem proxy_set_header próprio).
    # X-Forwarded-For e X-Real-IP levam só o IP real: o cliente não consegue falsificá-los
    # (o viva-webhook e os limites de taxa do auth leem-nos).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $loja3d_proto;
    proxy_set_header X-Forwarded-Host $loja3d_host;
    proxy_set_header X-Forwarded-Prefix $loja3d_prefix;
    proxy_set_header Authorization $loja3d_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }

    # ^~ : estas rotas não passam pelas regras de regex abaixo (ex.: /auth/v1/.well-known/jwks.json).
    location ^~ /rest/v1/ {
        client_max_body_size 10m;
        proxy_pass http://loja3d_rest/;
    }
    location ^~ /auth/v1/ {
        client_max_body_size 1m;
        proxy_pass http://loja3d_auth/;
    }
    location ^~ /storage/v1/ {
        # Uploads até 60 MB, enviados ao storage sem passar pelo disco do nginx.
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://loja3d_storage/;
    }
    location ^~ /functions/v1/ {
        # O edge-runtime corta pedidos inativos aos 150 s.
        client_max_body_size 60m;
        proxy_buffering off;
        proxy_read_timeout 155s;
        proxy_send_timeout 155s;
        proxy_pass http://loja3d_functions/;
    }

    # Sitemap no endereço habitual (motores de busca): gerado pela função sitemap (pública, sem JWT).
    location = /sitemap.xml {
        proxy_read_timeout 60s;
        proxy_pass http://loja3d_functions/sitemap;
    }

    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
